name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p package
          cp build/CalcX package/CalcX
          tar -czf "CalcX-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C package CalcX

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "CalcX-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
